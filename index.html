<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Layout: private-banking calm for a beauty house. Deep aubergine sidebar (brand, company switch, workspace nav,
   account), porcelain content area, hairline cards, champagne-gold accents, rose-plum for actions.
   Display: Fraunces italic. Text: DM Sans. Figures: DM Mono. */
:root{
  --bg:#f6f2f5; --surface:#ffffff; --ink:#1f1526; --muted:#6a5d72; --line:#e8dfe7; --head:#faf6f9;
  --accent:#8f2a5c; --accent-ink:#ffffff; --accent-soft:#f6e7ef;
  --btn-a:#a62f67; --btn-b:#6a2d93;
  --gold:#d9b97f; --gold-ink:#8a6a2f;
  --c1:#e8785a; --c2:#d6457f; --c3:#8b6cf0; --c4:#1f9f88;
  --sb-a:#2a1334; --sb-b:#170a1f; --sb-ink:#f6ecf3; --sb-muted:#bfaabb; --sb-line:rgba(255,255,255,.12); --sb-glass:rgba(255,255,255,.06); --sb-active:rgba(255,255,255,.13);
  --glow1:rgba(232,120,90,.10); --glow2:rgba(139,108,240,.10);
  --ok:#0d7050; --ok-bg:#dcf4e8; --warn:#8f4f06; --warn-bg:#ffecd2; --bad:#b52540; --bad-bg:#ffe1e6; --neutral-bg:#f1e8ef;
  --shadow:0 1px 2px rgba(60,20,70,.06),0 8px 24px rgba(60,20,70,.07);
  --shadow-lg:0 24px 60px rgba(40,10,60,.22);
  --ring:0 0 0 3px rgba(143,42,92,.22);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#130919; --surface:#1e1127; --ink:#f7ebf3; --muted:#bca8b9; --line:#38243f; --head:#261630;
    --accent:#f27fae; --accent-ink:#2a0a1a; --accent-soft:#3b2046;
    --btn-a:#c0407f; --btn-b:#7747c9;
    --gold:#e2c48c; --gold-ink:#e2c48c;
    --c1:#ff9174; --c2:#ff73a8; --c3:#ab90ff; --c4:#44d3b5;
    --sb-a:#1b0d24; --sb-b:#0e0614; --sb-line:rgba(255,255,255,.1);
    --glow1:rgba(232,120,90,.08); --glow2:rgba(139,108,240,.12);
    --ok:#6fe0b4; --ok-bg:#12372c; --warn:#ffc277; --warn-bg:#40290e; --bad:#ff97aa; --bad-bg:#43182a; --neutral-bg:#2b1a34;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --ring:0 0 0 3px rgba(242,127,174,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130919; --surface:#1e1127; --ink:#f7ebf3; --muted:#bca8b9; --line:#38243f; --head:#261630;
  --accent:#f27fae; --accent-ink:#2a0a1a; --accent-soft:#3b2046;
  --btn-a:#c0407f; --btn-b:#7747c9;
  --gold:#e2c48c; --gold-ink:#e2c48c;
  --c1:#ff9174; --c2:#ff73a8; --c3:#ab90ff; --c4:#44d3b5;
  --sb-a:#1b0d24; --sb-b:#0e0614; --sb-line:rgba(255,255,255,.1);
  --glow1:rgba(232,120,90,.08); --glow2:rgba(139,108,240,.12);
  --ok:#6fe0b4; --ok-bg:#12372c; --warn:#ffc277; --warn-bg:#40290e; --bad:#ff97aa; --bad-bg:#43182a; --neutral-bg:#2b1a34;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --ring:0 0 0 3px rgba(242,127,174,.32);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:radial-gradient(900px 500px at 100% 0%,var(--glow2),transparent 70%),radial-gradient(800px 500px at 30% 0%,var(--glow1),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding:0}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:25px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(90deg,var(--gold),#f3c9d9 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;font-weight:700}
.muted{color:var(--muted)}
.wrap{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.wrap[hidden]{display:none}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:26px 18px 18px;color:var(--sb-ink);background:radial-gradient(420px 300px at 0% 0%,rgba(217,185,127,.14),transparent 70%),linear-gradient(180deg,var(--sb-a),var(--sb-b));border-right:1px solid var(--sb-line)}
.top{display:flex;gap:12px;align-items:center;padding:0 6px 14px}
.top p{font-size:12px;color:var(--sb-muted);line-height:1.35;margin-top:3px}
.gmark{width:42px;height:42px;border-radius:13px;flex:none;display:block;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 6px 18px rgba(214,69,127,.35)}
.slabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);padding:14px 10px 6px}
.cos{display:flex;flex-direction:column;gap:6px}
.co{--co:var(--c2);font:inherit;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;color:var(--sb-ink);background:var(--sb-glass);border:1px solid var(--sb-line);border-radius:14px;cursor:pointer;text-align:left;min-width:0}
.co{justify-content:center;min-height:80px;padding:6px 8px;color:#1f1526;background:#fff;border:1.5px solid transparent;opacity:.94;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.co img{display:block;width:auto;height:auto;max-width:100%;max-height:74px;margin:0 auto}
.co:hover{background:#fff;opacity:1}
.co[aria-pressed="true"]{background:#fff;opacity:1;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,185,127,.4),0 12px 26px rgba(0,0,0,.35)}
.gco li{background:#fff;border-radius:12px;padding:6px 10px;justify-content:center;min-height:68px}
.gco li img{display:block;max-width:100%;max-height:60px;width:auto;height:auto}
.tabs{display:flex;flex-direction:column;gap:3px}
.tab{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:9px 12px;background:none;border:0;border-radius:12px;font:inherit;font-weight:500;color:var(--sb-muted);cursor:pointer;text-align:left;position:relative}
.tab:hover{background:var(--sb-glass);color:var(--sb-ink)}
.tab[aria-selected="true"]{background:var(--sb-active);color:#fff;font-weight:600}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.tab .c{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--sb-muted);background:rgba(255,255,255,.08);border-radius:999px;padding:1px 8px}
.tab[aria-selected="true"] .c{background:var(--gold);color:#2a1334}
.sfoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 4px 0;border-top:1px solid var(--sb-line)}
.sfoot .bk,.sfoot .gout{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{font-size:11.5px;color:var(--muted);font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.sfoot .sync{color:var(--sb-muted);background:var(--sb-glass);border-color:var(--sb-line)}
.sfoot #who{color:var(--sb-ink)}
.sfoot .btn{background:transparent;color:var(--sb-ink);border-color:var(--sb-line)}
.sfoot .btn:hover{background:var(--sb-glass)}
.content{min-width:0;padding:30px clamp(16px,3.2vw,44px) 64px;max-width:1360px;width:100%;display:flex;flex-direction:column;gap:20px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side button:focus-visible{outline-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{--k:var(--c2);background:var(--surface);padding:16px 18px;min-width:0;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi:nth-child(4n+1){--k:var(--c1)}.kpi:nth-child(4n+2){--k:var(--c2)}.kpi:nth-child(4n+3){--k:var(--c3)}.kpi:nth-child(4n+4){--k:var(--c4)}
.kpi .l{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .l::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;margin-top:6px}
.ph>div{min-width:0;max-width:540px}
.ph p{margin-top:4px}
.pt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;min-height:38px;padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 18px rgba(120,40,120,.28)}
.btn.primary:hover{color:#fff;filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:4px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px}
.lnk:hover{background:var(--accent-soft)}
.lnk.del{color:var(--bad)}
.lnk.del:hover{background:var(--bad-bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:42px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
input[type="search"]{width:210px;max-width:100%;border-radius:999px;padding-inline:16px}
input[type="checkbox"]{width:auto;min-height:0}
textarea{resize:vertical}
.form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.form h3{font-family:var(--display);font-size:19px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px}
.f{min-width:0}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.f small{display:block;color:var(--accent);font-size:12px;margin-top:4px;font-family:var(--mono)}
.f.wide{grid-column:1/-1}
.fa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ferr{color:var(--bad);font-weight:600}
.prev{display:flex;flex-wrap:wrap;gap:8px 32px;padding:14px 18px;background:var(--accent-soft);border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.pv .l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.block{margin-bottom:26px}
.bh{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:10px}
.bh h3{font-family:var(--display);font-size:19px;font-weight:600}
.bh .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:10px;font-weight:500;background:var(--neutral-bg);border-radius:999px;padding:2px 9px;vertical-align:middle}
.bt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:max-content}
th{background:var(--head);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 14px;white-space:nowrap;font-weight:700;border-bottom:1px solid var(--line)}
th.r{text-align:right}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .12s}
tbody tr:hover td{background:var(--head)}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono)}
td.wrapc{white-space:normal;min-width:200px}
td.act{text-align:right}
tfoot td{background:var(--head);font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.n0{background:var(--neutral-bg);color:var(--muted)}
table.tight th,table.tight td{padding-left:10px;padding-right:10px}
.chip.br{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:11px}
.who strong{display:block;line-height:1.25}
.who .sub{font-family:inherit;margin-top:1px}
.av{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.02em}
.dim{color:var(--muted);font-size:12.5px}
.sub{display:block;font-size:12px;color:var(--muted);font-family:var(--mono)}
.bar{display:inline-block;width:88px;height:8px;border-radius:4px;background:var(--neutral-bg);overflow:hidden;vertical-align:middle;margin-right:8px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}
.empty{border:1.5px dashed color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:22px;padding:32px 24px;background:var(--surface)}
.empty h3{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:4px}
.note{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 16px;font-weight:500}
.note .btn{color:var(--ink);background:var(--surface)}
.note+.note{margin-top:8px}
.note.due{background:var(--bad-bg);color:var(--bad)}
.bk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);z-index:100;box-shadow:var(--shadow-lg)}
.gate{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:24px 16px;background-color:var(--bg);background-image:radial-gradient(800px 520px at 8% 6%,var(--glow1),transparent 70%),radial-gradient(800px 560px at 92% 94%,var(--glow2),transparent 70%)}
.gate[hidden]{display:none}
.gcard{width:100%;max-width:900px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow-lg);overflow:hidden}
.gart{padding:38px 34px;color:var(--sb-ink);display:flex;flex-direction:column;gap:18px;background:radial-gradient(420px 320px at 0% 0%,rgba(217,185,127,.2),transparent 70%),radial-gradient(360px 300px at 100% 100%,rgba(214,69,127,.28),transparent 70%),linear-gradient(160deg,var(--sb-a),var(--sb-b))}
.gname{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.1;font-weight:600;text-wrap:balance}
.gtag{color:var(--sb-muted);font-size:14px;line-height:1.6}
.gco{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;font-weight:500}
.gco li{display:flex;align-items:center;gap:10px}
.gco i{width:9px;height:9px;border-radius:50%;flex:none}
.gmain{padding:40px 38px;display:flex;flex-direction:column;gap:20px;justify-content:center;min-width:0}
.gmain h2{font-size:30px}
.gform{display:flex;flex-direction:column;gap:14px}
.gpw{position:relative}
.gpw input{padding-right:70px}
.gpw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:12px}
.gmain .btn.primary{min-height:46px;font-size:15px;border-radius:12px}
.gfoot{font-size:12.5px;color:var(--muted)}
.gfoot .lnk{padding:2px 4px;font-size:12.5px}
.gout{display:inline-flex;gap:8px;align-items:center}
@media (max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;overflow:visible;padding:18px 16px 14px;border-right:0;border-bottom:1px solid var(--sb-line)}
  .cos{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .co{width:auto;flex:none;min-width:150px;min-height:62px}
  .co img{max-height:44px}
  .tabs{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .tab{width:auto;flex:none;white-space:nowrap}
  .tab[aria-selected="true"]::before{left:12px;right:12px;top:auto;bottom:2px;height:3px;width:auto;border-radius:3px}
  .sfoot{margin-top:6px}
  .content{padding:20px 16px 56px}
}
@media (max-width:760px){
  .gcard{grid-template-columns:minmax(0,1fr)}
  .gart{padding:24px 24px 20px}
  .gname{font-size:24px}
  .gco{display:none}
  .gmain{padding:26px 22px}
}
@media (max-width:640px){
  h2{font-size:24px}
  .kpi .v{font-size:23px}
  input[type="search"]{width:100%}
  .pt{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.co,.tab,.lnk{transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease)}
  .btn:active,.co:active,.tab:active{transform:scale(.98)}
  .kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .kpi:hover{transform:translateY(-2px)}
  .content>*{animation:rise .35s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* ---------- BOM sheet ---------- */
.bom-ov{position:fixed;inset:0;z-index:90;background:rgba(20,10,28,.6);overflow:auto;padding:16px}
.bom-ov[hidden]{display:none}
.bom-bar{max-width:900px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;color:#fff}
.bom-bar h3{font-family:var(--display);font-size:19px;font-weight:600;margin-right:auto;color:#fff}
.bom-bar .btn{background:var(--surface);color:var(--ink)}
.bom-bar .btn.primary{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff}
.bom-sheet{max-width:900px;margin:0 auto;background:#fff;color:#000;border-radius:6px;padding:26px 30px 30px;font-family:Arial,Helvetica,sans-serif;font-size:13px;overflow-x:auto}
.bom-dates{display:flex;justify-content:space-between;gap:16px;font-size:13px;margin-bottom:4px}
.bom-dates input{width:150px}
.bom-t{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;margin-bottom:26px}
.bom-t th,.bom-t td{border:1px solid #000;padding:0;vertical-align:middle;background:#fff;white-space:normal;color:#000;text-align:center}
.bom-t th{font-weight:700;padding:7px 6px;font-size:13px;text-transform:none;letter-spacing:0;border-bottom:1px solid #000}
.bom-t tbody tr:hover td{background:#fff}
.bom-t tbody tr:last-child td{border-bottom:1px solid #000}
.bom-t td.bx,.bom-t tbody tr:last-child td.bx{border:0}
.bom-t.head th{width:25%;padding:12px 6px}
.bom-t.items th{font-size:13px}
.bom-t .bi,.bom-dates input{width:100%;border:0;outline:0;background:transparent;font:inherit;color:#000;padding:8px 8px;resize:none;display:block;min-height:34px;overflow:hidden;border-radius:0;box-shadow:none;text-align:center}
.bom-t.head .bi{text-align:left}
.bom-dates input{padding:0 4px;min-height:0;display:inline-block;text-align:left;border-bottom:1px solid #bbb;width:150px}
.bom-t .bi:focus,.bom-dates input:focus{background:#fff7d6}
.bom-t .bi[readonly]:focus{background:transparent}
.bom-t td.bx{width:34px;background:transparent}
.bom-t.items{margin-bottom:10px}
.bom-add{margin-bottom:18px}
.bom-special{margin-bottom:28px;display:flex;gap:6px;align-items:flex-start}
.bom-special b{white-space:nowrap;padding-top:2px}
.bom-special .bi{border:0;border-bottom:1px solid #bbb;padding:2px 2px;min-height:0;text-align:left;background:transparent;font:inherit;color:#000;width:100%;resize:none;overflow:hidden;outline:0}
.bom-t.sign{margin-bottom:0}
.bom-t.sign th{width:33.33%}
.bom-t.sign .bi{min-height:40px}
@media print{
  body.bom-open>*:not(#bomOverlay){display:none!important}
  .bom-ov{position:static;background:#fff;padding:0;overflow:visible}
  .bom-bar,.no-print,col.bx-col{display:none!important}
  .bom-dates input::-webkit-calendar-picker-indicator{display:none}
  .bom-dates input.is-empty{color:transparent}
  .bom-sheet{max-width:none;border-radius:0;padding:0;overflow:visible}
  .bom-t .bi,.bom-dates input,.bom-special .bi{border-color:transparent;background:transparent!important}
  .bom-dates input{border-bottom-color:transparent}
  .bom-t tr{break-inside:avoid}
}

const inr=v=>'₹'+nf2.format(v||0);
const qty=v=>nf0.format(v||0);
const advUnit=p=>{if(!p)return 0;const c=+p.cost||0;if(p.advPct!=null&&p.advPct!=='')return c*(+p.advPct||0)/100;return +p.advPerUnit||0;};
const advPctOf=p=>{if(!p)return null;if(p.advPct!=null&&p.advPct!=='')return +p.advPct;const c=+p.cost||0;return c>0?(+p.advPerUnit||0)/c*100:null;};
const pct=v=>(Math.round(v*10)/10).toFixed(1)+'%';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const p=s.split('-').map(Number);return String(p[2]).padStart(2,'0')+'-'+MON[p[1]-1]+'-'+String(p[0]).slice(2);};
const addDays=(s,n)=>{const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);};
const daysBetween=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);};
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''));
const norm=s=>String(s||'').trim().toUpperCase();
const gkey=(po,pid)=>norm(po)+'|'+pid;

/* ---------- state ---------- */
const S={co:'si',tab:'invoices',q:'',showDone:false,form:null,delArm:null,blocks:[]};
const D={};
COS.forEach(c=>{D[c.key]={};SECS.forEach(s=>{D[c.key][s]=new Map();});});
let store=null, dl=null, R=null, delTimer=null, toastTimer=null;

function loadUI(){try{const u=JSON.parse(localStorage.getItem('orderdesk:ui')||'{}');if(COS.some(c=>c.key===u.co))S.co=u.co;if(SECS.includes(u.tab)||u.tab==='admin')S.tab=u.tab;}catch(e){}}
function saveUI(){try{localStorage.setItem('orderdesk:ui',JSON.stringify({co:S.co,tab:S.tab}));}catch(e){}}
const lsKey=(k,s)=>'orderdesk:data:'+k+':'+s;
function loadLocal(){COS.forEach(c=>SECS.forEach(s=>{try{JSON.parse(localStorage.getItem(lsKey(c.key,s))||'[]').forEach(r=>D[c.key][s].set(r.id,r));}catch(e){}}));}
function saveLocal(k,s){try{localStorage.setItem(lsKey(k,s),JSON.stringify([...D[k][s].values()]));}catch(e){}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3200);}

/* ---------- storage ---------- */
async function put(sec,row){
  const k=S.co,id=row.id||uid();
  const r=JSON.parse(JSON.stringify(Object.assign({},row,{id:id})));
  const prev=D[k][sec].get(id);
  if(prev&&!canModify(prev)){toast('You can only edit entries you added.');return false;}
  if(prev){['createdBy','createdByName','createdAt'].forEach(f=>{if(prev[f]!==undefined)r[f]=prev[f];});}
  if(prev&&prev.bom&&r.bom===undefined)r.bom=prev.bom; /* editing a product must not wipe its BOM */
  else if(ME){r.createdBy=ME.id;r.createdByName=ME.user;r.createdAt=todayStr();}
  D[k][sec].set(id,r);
  if(store){
    try{await store.collection(k+'_'+sec).doc(id).set(r);}
    catch(e){if(prev)D[k][sec].set(id,prev);else D[k][sec].delete(id);refresh();toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));return false;}
  }else{saveLocal(k,sec);}
  refresh();return true;
}
async function del(sec,id){
  const k=S.co,prev=D[k][sec].get(id);
  if(prev&&!canModify(prev)){toast('You can only delete entries you added.');return false;}
  D[k][sec].delete(id);
  if(store){
    try{await store.collection(k+'_'+sec).doc(id).delete();}
    catch(e){if(prev)D[k][sec].set(id,prev);refresh();toast('Could not delete: '+((e&&(e.message||e.code))||'unknown error'));return false;}
  }else{saveLocal(k,sec);}
  refresh();return true;
}

/* ---------- calculations ---------- */
function dataFor(key,over){
  const d=D[key];
  const o={clients:d.clients,products:d.products,advances:[...d.advances.values()],invoices:[...d.invoices.values()],payments:[...d.payments.values()],dispatches:[...d.dispatches.values()]};
  if(over){o[over.sec]=o[over.sec].filter(r=>r.id!==over.row.id);o[over.sec].push(over.row);}
  return o;
}
function calc(d){
  const P=d.products,C=d.clients;
  const prod=id=>P.get(id)||null;
  const cli=p=>p?(C.get(p.clientId)||null):null;
  const srt=(a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.id||'').localeCompare(String(b.id||''));
  const groups=new Map();
  const G=(po,pid)=>{const k=gkey(po,pid);let g=groups.get(k);if(!g){g={k:k,po:String(po||'').trim(),pid:pid,poQty:0,poRate:0,received:0,invQty:0,adjusted:0,dispQty:0,logQty:0,hasAdv:false};groups.set(k,g);}return g;};

  const adv=[...d.advances].sort(srt);
  adv.forEach(a=>{const g=G(a.po,a.productId);g.hasAdv=true;g.poQty=Math.max(g.poQty,+a.poQty||0);if(+a.poRate)g.poRate=+a.poRate;g.received+=+a.received||0;});

  const payBy=new Map();d.payments.forEach(x=>payBy.set(x.invoiceId,(payBy.get(x.invoiceId)||0)+(+x.amount||0)));
  const inv=[...d.invoices].sort(srt).map(i=>{
    const p=prod(i.productId),g=G(i.po,i.productId);
    const q=+i.qty||0,cost=p?+p.cost||0:0,au=advUnit(p);
    g.invQty+=q;
    const nonGst=q*cost,extra=+i.extra||0,gst=(nonGst+extra)*GST,total=nonGst+extra+gst;
    const avail=Math.max(0,g.received-g.adjusted);
    const adj=Math.min(q*au,nonGst,avail);
    g.adjusted+=adj;
    const net=total-adj,paid=(+i.paid||0)+(payBy.get(i.id)||0),pend=Math.max(0,net-paid);
    const due=i.date?addDays(i.date,p?+p.terms||0:0):'';
    return Object.assign({},i,{p:p,c:cli(p),g:g,q:q,nonGst:nonGst,extra:extra,gst:gst,total:total,adj:adj,net:net,paid:paid,legacyPaid:+i.paid||0,pend:pend,due:due,
      remain:g.poQty>0?g.poQty-g.invQty:null,advLeft:g.received-g.adjusted,
      status:pend<=TOL?'Paid':(paid>0?'Partial':'Unpaid')});
  });

  const invById=new Map(inv.map(i=>[i.id,i]));const payRun=new Map();
  const pay=[...d.payments].sort(srt).map(x=>{const i=invById.get(x.invoiceId)||null;const cum=(payRun.get(x.invoiceId)||0)+(+x.amount||0);payRun.set(x.invoiceId,cum);
    return Object.assign({},x,{i:i,p:i?i.p:null,c:i?i.c:null,amt:+x.amount||0,pendAfter:i?Math.max(0,i.net-i.legacyPaid-cum):null});});
  const dis=[...d.dispatches].sort(srt).map(x=>{const p=prod(x.productId),g=G(x.po,x.productId);const q=+x.qty||0;g.logQty+=q;return Object.assign({},x,{p:p,c:cli(p),q:q});});

  groups.forEach(g=>{
    const p=prod(g.pid);
    g.p=p;g.c=cli(p);g.advUnit=advUnit(p);
    g.required=g.poQty*g.advUnit;g.orderValue=g.poQty*g.poRate;
    g.pending=Math.max(0,g.required-g.received);g.excess=Math.max(0,g.received-g.required);
    g.recvPct=g.required>0?g.received/g.required*100:null;
    g.unadj=g.received-g.adjusted;
    g.dispQty=Math.max(g.invQty,g.logQty);
    g.pendDisp=g.poQty>0?Math.max(0,g.poQty-g.dispQty):null;
    g.ready=Math.max(0,g.invQty-g.logQty);
  });

  const run=new Map();
  const advRows=adv.map(a=>{
    const g=groups.get(gkey(a.po,a.productId));
    const cum=(run.get(g.k)||0)+(+a.received||0);run.set(g.k,cum);
    const req=g.required;
    return Object.assign({},a,{p:g.p,c:g.c,g:g,req:req,pctThis:req>0?(+a.received||0)/req*100:null,cum:cum,pendAfter:Math.max(0,req-cum),pendPct:req>0?Math.max(0,req-cum)/req*100:null});
  });

  const gl=[...groups.values()];
  const sum=(arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
  const today=todayStr();
  const t={
    advReceived:sum(advRows,r=>+r.received),
    advPending:sum(gl.filter(g=>g.hasAdv),g=>g.pending),
    outstanding:sum(inv,i=>i.pend),
    overdue:inv.filter(i=>i.pend>TOL&&i.due&&daysBetween(today,i.due)<0).length,
    toDispatch:sum(gl,g=>g.pendDisp||0),
    ready:sum(gl,g=>g.ready),
    openPOs:gl.filter(g=>g.pendDisp>0).length,
    poCount:gl.filter(g=>g.hasAdv).length
  };
  return {groups:gl,advRows:advRows,inv:inv,pay:pay,dis:dis,t:t};
}
function recompute(){R=calc(dataFor(S.co));}

  return [
    {id:'disp-summary',name:'pending dispatch',title:'Pending dispatch by PO',rows:gl,
      extra:'<label class="chk"><input type="checkbox" id="showdone"'+(S.showDone?' checked':'')+'> Show completed POs</label>',

function cellHTML(c,r){

}
function filtered(b){
  if(b.search&&S.q){const q=S.q.toLowerCase();return b.rows.filter(r=>b.cols.some(c=>String(c.t(r)==null?'':c.t(r)).toLowerCase().includes(q)));}
  return b.rows;
}
function blockHTML(b){
  const rows=filtered(b);
  const cnt=rows.length+(rows.length!==b.rows.length?' of '+b.rows.length:'');
  let h='<section class="block"><div class="bh"><h3>'+esc(b.title)+'<span class="cnt">'+cnt+'</span></h3><div class="bt">'+(b.extra||'')+
    (dl&&b.rows.length?'<button class="btn sm" data-act="csv" data-b="'+b.id+'">Export CSV</button>':'')+'</div></div>';
  if(!b.rows.length){return h+'<div class="empty"><h3>'+esc(b.empty[0])+'</h3><p class="muted">'+esc(b.empty[1])+'</p></div></section>';}
  if(!rows.length){return h+'<div class="empty"><h3>No rows match</h3><p class="muted">Clear the search to see every row.</p></div></section>';}
  const vc=b.cols.filter(c=>!c.x);
  h+='<div class="tw"><table'+(b.tight?' class="tight"':'')+'><thead><tr>'+vc.map(c=>'<th class="'+(c.cls==='n'?'r':'')+'">'+esc(c.h)+'</th>').join('')+((b.edit||b.acts)?'<th></th>':'')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr>'+vc.map(c=>'<td class="'+(c.cls||'')+'">'+cellHTML(c,r)+'</td>').join('');
    if(b.edit||b.acts)h+='<td class="act">'+(b.acts?b.acts(r):stdActs(b.edit,r))+'</td>';
    h+='</tr>';
  });
  h+='</tbody>';
  if(vc.some(c=>c.s)){
    h+='<tfoot><tr>'+vc.map((c,i)=>{if(i===0)return '<td>Total</td>';if(!c.s)return '<td></td>';const s=rows.reduce((a,r)=>a+(+c.t(r)||0),0);return '<td class="n">'+esc(c.fmt(s))+'</td>';}).join('')+((b.edit||b.acts)?'<td></td>':'')+'</tr></tfoot>';
  }
  return h+'</table></div></section>';
}

const SOON=3;
function renderBanner(){
  const el=$('#banner');if(!el)return;
  const d0=D[S.co];let n=0;SECS.forEach(s=>d0[s].forEach(r=>{if(r.sample)n++;}));
  const sampleHTML=n?'<div class="note"><span>Example rows from your payment sheet are loaded for this company, so you can see how it works.</span><button class="btn sm" data-act="clearsample">Clear example rows</button></div>':'';
  const today=todayStr();let parts=[],cur=null;
  COS.forEach(c=>{
    const r=c.key===S.co&&R?R:calc(dataFor(c.key));
    const open=r.inv.filter(i=>i.pend>TOL&&i.due);
    const od=open.filter(i=>daysBetween(today,i.due)<0),soon=open.filter(i=>{const d=daysBetween(today,i.due);return d>=0&&d<=SOON;});
    if(od.length||soon.length){
      const bits=[];
      if(od.length)bits.push(od.length+(od.length===1?' invoice':' invoices')+' overdue ('+inr(od.reduce((a,i)=>a+i.pend,0))+')');
      if(soon.length)bits.push(soon.length+(soon.length===1?' invoice':' invoices')+' due within '+SOON+' days ('+inr(soon.reduce((a,i)=>a+i.pend,0))+')');
      parts.push('<strong>'+esc(c.name)+':</strong> '+bits.join(', '));
    }
  });
  if(!parts.length){el.innerHTML=sampleHTML;return;}
  el.innerHTML=sampleHTML+'<div class="note due" role="status"><span>Payment due. '+parts.join(' &nbsp;·&nbsp; ')+'</span>'+(S.tab==='payments'?'':'<button class="btn sm" data-act="goto" data-tab="payments">View payments</button>')+'</div>';

function reminderText(i){

  const lines=['Dear '+(c.contact||c.name||'Sir/Madam')+',','',
    (dd!=null&&dd<0?'This is a reminder that the payment for the invoice below is overdue by '+(-dd)+' day'+(-dd===1?'':'s')+'.':'This is a gentle reminder about the payment for the invoice below.'),'',
    'Invoice no.: '+i.invNo,'Invoice date: '+fd(i.date),'PO number: '+i.po,'Product: '+(i.p?i.p.name:''),
    'Amount due: '+inr(i.net),'Received so far: '+inr(i.paid),'Pending: '+inr(i.pend),'Due date: '+fd(i.due),'',
    'Kindly arrange the payment at the earliest and share the transaction details. Please ignore this mail if the payment has already been made.','','Thanks and regards,',co];

function saveBlob(filename,data,type){
  const b=new Blob([data],{type:type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}

function backupAll(){
  const out={app:'order-desk',version:1,exported:new Date().toISOString(),data:{}};
  COS.forEach(c=>{out.data[c.key]={};SECS.forEach(s=>{out.data[c.key][s]=[...D[c.key][s].values()];});});
  saveBlob('order-desk-backup-'+todayStr()+'.json',JSON.stringify(out,null,1),'application/json');

function restoreAll(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const j=JSON.parse(fr.result);
      if(!j||j.app!=='order-desk'||!j.data)throw new Error('bad');
      if(!window.confirm('Restore this backup? It replaces everything currently saved in this browser.'))return;
      COS.forEach(c=>SECS.forEach(s=>{
        const rows=(j.data[c.key]&&j.data[c.key][s])||[];
        D[c.key][s]=new Map(rows.filter(r=>r&&r.id).map(r=>[r.id,r]));
        saveLocal(c.key,s);
      }));
      S.form=null;buildAll();toast('Backup restored');
    }catch(e){toast('That file is not an Order & Payment Desk backup.');}
  };
  fr.readAsText(file);
}

/* ---------- accounts and login gate ---------- */
const USERS_KEY='orderdesk:users',AUTH_KEY='orderdesk:auth',SESS_KEY='orderdesk:session';
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256)));
}
let USERS=new Map(),ME=null,usersReady=false,gateMode='login';
const slug=u=>String(u||'').trim().toLowerCase();
const validUser=u=>/^[a-z0-9_.-]{3,30}$/i.test(u);
const isAdmin=()=>!!ME&&ME.role==='admin';
const canModify=r=>!!ME&&(ME.role==='admin'||(!!r&&!!r.createdBy&&(r.createdBy===ME.id||r.createdBy==='pi')));
const whoName=r=>r&&r.createdBy?((USERS.get(r.createdBy)||{}).user||r.createdByName||'a user'):'admin';
const hasSession=()=>{try{return sessionStorage.getItem(SESS_KEY)||'';}catch(e){return '';}};
const setSession=v=>{try{if(v)sessionStorage.setItem(SESS_KEY,v);else sessionStorage.removeItem(SESS_KEY);}catch(e){}};
function saveLocalUsers(){try{localStorage.setItem(USERS_KEY,JSON.stringify([...USERS.values()]));}catch(e){}}
function loadLocalUsers(){
  try{JSON.parse(localStorage.getItem(USERS_KEY)||'[]').forEach(u=>USERS.set(u.id,u));}catch(e){}
  if(!USERS.size){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.user&&a.salt&&a.hash){USERS.set(slug(a.user),{id:slug(a.user),user:a.user,salt:a.salt,hash:a.hash,role:'admin',created:todayStr()});saveLocalUsers();}}catch(e){}}
}
async function putUser(u){
  const prev=USERS.get(u.id);USERS.set(u.id,u);
  if(store){try{await store.collection('users').doc(u.id).set(u);}catch(e){if(prev)USERS.set(u.id,prev);else USERS.delete(u.id);toast('Could not save: '+((e&&(e.message||e.code))||'unknown error'));return false;}}
  else saveLocalUsers();
  return true;
}
async function removeUser(id){
  const prev=USERS.get(id);USERS.delete(id);
  if(store){try{await store.collection('users').doc(id).delete();}catch(e){if(prev)USERS.set(id,prev);toast('Could not delete the user.');return false;}}
  else saveLocalUsers();
  return true;
}
function subscribeUsers(){
  store.collection('users').onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(doc=>{m.set(doc.id,Object.assign({},doc.data(),{id:doc.id}));});
    USERS=m;
    const first=!usersReady;usersReady=true;
    if(first){gateReady();return;}
    if(ME){
      if(!USERS.has(ME.id)){ME=null;setSession('');showGate();return;}
      ME=USERS.get(ME.id);renderWho();if(S.tab==='admin'&&!isAdmin())S.tab='clients';
    }else if(!$('#gate').hidden){showGate();}
    if(R)refresh();
  },err=>{usersReady=true;toast('Live users stopped: '+((err&&err.code)||'unknown'));gateReady();});
}
function renderWho(){const w=$('#who');if(w)w.textContent=ME?ME.user+' · '+(ME.role==='admin'?'Admin':'User'):'';}
function lockApp(locked){
  const w=document.querySelector('.wrap'),g=$('#gate'),t=$('#toast');
  w.hidden=locked;g.hidden=!locked;if(locked)t.hidden=true;
}
function afterLogin(){
  lockApp(false);renderWho();
  if(S.tab==='admin'&&!isAdmin())S.tab='clients';
  S.form=null;buildAll();
}
function gateReady(){
  const sid=hasSession();
  if(sid&&USERS.has(sid)){ME=USERS.get(sid);afterLogin();}else showGate();
}
function showGate(){
  lockApp(true);
  const go=$('#g_go'),form=$('#gform');
  if(!usersReady){$('#gt').textContent='Loading…';$('#gsub').textContent='';form.hidden=true;$('#gfoot').textContent='';return;}
  form.hidden=false;
  const first=USERS.size===0,create=first||gateMode==='signup';
  $('#gt').textContent=first?'Create the admin login':(create?'Create your account':'Welcome back');
  $('#gsub').textContent=first?'This first account becomes the admin. The admin can edit or delete any entry and manage other users.':(create?'You can edit or delete only the entries you add. The admin can manage everything.':'Log in to open the desk.');
  $('#g_c_wrap').hidden=!create;
  go.textContent=create?(first?'Create admin login':'Sign up'):'Log in';
  $('#g_pass').autocomplete=create?'new-password':'current-password';
  $('#g_err').textContent='';$('#g_pass').value='';$('#g_conf').value='';
  $('#g_pass').type=$('#g_conf').type='password';$('#g_show').textContent='Show';
  let f='';
  if(!first)f+=create?'Already have an account? <button type="button" class="lnk" data-gate="login">Log in</button>':'New here? <button type="button" class="lnk" data-gate="signup">Sign up</button> &nbsp;·&nbsp; <button type="button" class="lnk" id="g_forgot">Forgot password?</button>';
  else f+='The login is saved '+(store?'in the shared store':'on this device')+'. Choose a password you will remember.';
  $('#gfoot').innerHTML=f;
  setTimeout(()=>{$('#g_user').focus();},0);
}
async function submitGate(e){
  e.preventDefault();
  const err=$('#g_err'),user=$('#g_user').value.trim(),pw=$('#g_pass').value;
  err.textContent='';
  if(!usersReady)return;
  if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot create a secure login. Open the page in an up-to-date browser.';return;}
  const first=USERS.size===0,create=first||gateMode==='signup';
  if(create){
    if(!validUser(user))return void(err.textContent='Username needs 3 to 30 letters, numbers, dots, dashes or underscores.');
    if(pw.length<6)return void(err.textContent='Password needs at least 6 characters.');
    if(pw!==$('#g_conf').value)return void(err.textContent='The two passwords do not match.');
    if(USERS.has(slug(user)))return void(err.textContent='That username is taken. Choose another.');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const u={id:slug(user),user:user,salt:b64(salt),hash:await hashPw(pw,salt),role:first?'admin':'user',created:todayStr()};
    if(!(await putUser(u)))return;
    ME=u;setSession(u.id);gateMode='login';afterLogin();toast(first?'Admin login created':'Account created');
  }else{
    const u=USERS.get(slug(user));
    if(!u||await hashPw(pw,unb64(u.salt))!==u.hash){err.textContent='Username or password is not correct.';$('#g_pass').select();return;}
    ME=u;setSession(u.id);afterLogin();
  }
}
async function setUserPassword(uid,pw){
  const u=USERS.get(uid);if(!u)return false;
  const salt=crypto.getRandomValues(new Uint8Array(16));
  return putUser(Object.assign({},u,{salt:b64(salt),hash:await hashPw(pw,salt)}));
}

  document.addEventListener('click',e=>{

      const r=$('#g_reset');if(r)r.focus();
    }
    if(t.id==='g_reset_go'){
      if($('#g_reset').value.trim().toUpperCase()!=='RESET'){$('#g_err').textContent='Type RESET to confirm.';return;}
      USERS=new Map();saveLocalUsers();try{localStorage.removeItem(AUTH_KEY);}catch(x){}setSession('');ME=null;gateMode='login';showGate();
    }
    if(t.closest&&t.closest('[data-act="logout"]')){ME=null;setSession('');S.form=null;gateMode='login';showGate();}
  });
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='pwf')return;
    e.preventDefault();
    const pw=$('#rp_pw').value;
    if(pw.length<6){$('#ferr').textContent='Password needs at least 6 characters.';return;}

  });
  showGate();

function bomTA(id,v,ro){return '<textarea class="bi" id="'+id+'" rows="1"'+(ro?' readonly':'')+'>'+esc(v)+'</textarea>';}
function bomRowHTML(r,ro){
  const f=(k,v)=>'<td><textarea class="bi" data-f="'+k+'" rows="1"'+(ro?' readonly':'')+'>'+esc(v)+'</textarea></td>';
  return '<tr>'+f('item',r.item)+f('desc',r.desc)+f('qty',r.qty)+f('art',r.art)+(ro?'':'<td class="bx no-print"><button type="button" class="lnk del" data-act="bomrm" aria-label="Remove row" title="Remove row">✕</button></td>')+'</tr>';
}
function bomGrow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function bomGrowAll(){document.querySelectorAll('#bomOverlay textarea').forEach(bomGrow);}
function openBom(id){
  const p=D[S.co].products.get(id);if(!p)return;
  const d=bomData(p),ro=!canModify(p);
  BOM.id=id;BOM.ro=ro;BOM.dirty=false;
  const hrow=(label,fid,v)=>'<tr><th scope="row">'+label+'</th><td>'+bomTA(fid,v,ro)+'</td></tr>';
  $('#bomOverlay').innerHTML=
    '<div class="bom-bar"><h3>Bill of materials · '+esc(p.name)+'</h3>'+
      (ro?'<span class="muted" style="color:#fff">View only: you can print it but not change it.</span>':'<button class="btn primary" data-act="bomsave">Save BOM</button>')+
      '<button class="btn" data-act="bomprint">Print / Save PDF</button><button class="btn" data-act="bomclose">Close</button></div>'+
    '<div class="bom-sheet" id="bomSheet">'+
      '<div class="bom-dates"><label>DATE OF CREATION - <input type="date" id="b_created" value="'+esc(d.created)+'"'+(ro?' readonly':'')+'></label><label>DATE OF RECEIVING- <input type="date" id="b_recv" value="'+esc(d.recv)+'"'+(ro?' readonly':'')+'></label></div>'+
      '<table class="bom-t head"><tbody>'+hrow('Company Name','b_company',d.company)+hrow('Brand name','b_brand',d.brand)+hrow('Product Name','b_product',d.product)+hrow('SKU Size','b_sku',d.sku)+hrow('MRP Rs.','b_mrp',d.mrp)+hrow('USP Rs.','b_usp',d.usp)+'</tbody></table>'+
      '<table class="bom-t items"><colgroup><col style="width:27%"><col style="width:26%"><col style="width:21%"><col style="width:26%">'+(ro?'':'<col class="bx-col" style="width:34px">')+'</colgroup>'+
        '<thead><tr><th>Item Name</th><th>Description</th><th>Qty/Case</th><th>APPROVED ARTWORK</th>'+(ro?'':'<th class="bx no-print" style="border:0;background:transparent"></th>')+'</tr></thead>'+
        '<tbody id="bomRows">'+d.rows.map(r=>bomRowHTML(r,ro)).join('')+'</tbody></table>'+
      (ro?'':'<button type="button" class="btn sm bom-add no-print" data-act="bomadd">+ Add row</button>')+
      '<div class="bom-special"><b>Special Instruction:</b>'+bomTA('b_special',d.special,ro).replace('class="bi"','class="bi sp"')+'</div>'+
      '<table class="bom-t sign"><thead><tr><th>Prepared By</th><th>Checked By</th><th>Approved By</th></tr></thead><tbody><tr><td>'+bomTA('b_prepared',d.prepared,ro)+'</td><td>'+bomTA('b_checked',d.checked,ro)+'</td><td>'+bomTA('b_approved',d.approved,ro)+'</td></tr></tbody></table>'+
    '</div>';
  BOM.title=document.title;
  document.body.classList.add('bom-open');
  const ov=$('#bomOverlay');ov.hidden=false;ov.scrollTop=0;
  bomGrowAll();
  document.querySelectorAll('#bomOverlay input[type=date]').forEach(i=>i.classList.toggle('is-empty',!i.value));
}
function bomRead(){
  const g=id=>$('#'+id).value.trim();
  return {created:g('b_created'),recv:g('b_recv'),company:g('b_company'),brand:g('b_brand'),product:g('b_product'),sku:g('b_sku'),mrp:g('b_mrp'),usp:g('b_usp'),
    rows:[...document.querySelectorAll('#bomRows tr')].map(tr=>{const v=k=>tr.querySelector('[data-f="'+k+'"]').value.trim();return {item:v('item'),desc:v('desc'),qty:v('qty'),art:v('art')};}),
    special:g('b_special'),prepared:g('b_prepared'),checked:g('b_checked'),approved:g('b_approved')};
}
async function bomSave(){
  const p=D[S.co].products.get(BOM.id);
  if(!p||!canModify(p)){toast('You can only edit BOMs for products you may edit.');return;}
  if(await put('products',Object.assign({},p,{bom:bomRead()}))){BOM.dirty=false;toast('BOM saved');}
}
function bomClose(){
  if(BOM.dirty&&!BOM.ro&&!confirm('Close without saving your changes to this BOM?'))return;
  $('#bomOverlay').hidden=true;$('#bomOverlay').innerHTML='';document.body.classList.remove('bom-open');BOM.id=null;
}
function bomPrint(){
  const p=D[S.co].products.get(BOM.id);
  const name=['BOM',($('#b_brand')||{}).value,($('#b_product')||{}).value].filter(Boolean).join(' - ');
  const old=document.title;document.title=name||old;
  bomGrowAll();window.print();
  setTimeout(()=>{document.title=old;},800);
}
document.addEventListener('input',e=>{
  if(!e.target.closest||!e.target.closest('#bomOverlay'))return;
  BOM.dirty=true;if(e.target.tagName==='TEXTAREA')bomGrow(e.target);
  if(e.target.type==='date')e.target.classList.toggle('is-empty',!e.target.value);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#bomOverlay').hidden)bomClose();
  /* Enter inside a one-line BOM cell should not add a line break */
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('bi')&&!e.shiftKey)e.preventDefault();
});
window.addEventListener('beforeprint',()=>{if(!$('#bomOverlay').hidden)bomGrowAll();});

/* ---------- admin ---------- */
function stdActs(sec,r){
  if(canModify(r))return '<button class="lnk" data-act="edit" data-sec="'+sec+'" data-id="'+esc(r.id)+'">Edit</button><button class="lnk del" data-act="del" data-sec="'+sec+'" data-id="'+esc(r.id)+'">'+(S.delArm===r.id?'Confirm delete':'Delete')+'</button>';
  return '<span class="muted">Added by '+esc(whoName(r))+'</span>';
}
function countBy(uid){let n=0;COS.forEach(c=>SECS.forEach(s=>D[c.key][s].forEach(r=>{if(r.createdBy===uid)n++;})));return n;}
function userActs(u){
  if(ME&&u.id===ME.id)return '<span class="muted">You</span>';
  const arm=S.delArm==='u:'+u.id;
  return '<button class="lnk" data-act="urole" data-id="'+esc(u.id)+'">'+(u.role==='admin'?'Make user':'Make admin')+'</button><button class="lnk" data-act="upw" data-id="'+esc(u.id)+'">Reset password</button><button class="lnk del" data-act="udel" data-id="'+esc(u.id)+'">'+(arm?'Confirm delete':'Delete')+'</button>';
}
function adminEntries(){
  const d=D[S.co],out=[],P=d.products;
  const pn=id=>{const p=P.get(id);return p?p.name:'(removed product)';};
  const push=(sec,label,r,text,date)=>out.push({id:r.id,sec:sec,label:label,text:text,date:date||'',rec:r});
  d.clients.forEach(r=>push('clients','Client',r,r.name+(r.brand?' · '+r.brand:''),''));
  d.products.forEach(r=>push('products','Product',r,r.name,''));
  d.advances.forEach(r=>push('advances','Advance',r,pn(r.productId)+' · PO '+r.po+' · '+inr(r.received),r.date));
  d.invoices.forEach(r=>push('invoices','Invoice',r,'Invoice '+r.invNo+' · '+pn(r.productId)+' · PO '+r.po+' · qty '+qty(r.qty),r.date));
  d.payments.forEach(r=>{const iv=d.invoices.get(r.invoiceId);push('payments','Payment',r,inr(r.amount)+' · invoice '+(iv?iv.invNo:'(removed)'),r.date);});
  d.dispatches.forEach(r=>push('dispatches','Dispatch',r,pn(r.productId)+' · PO '+r.po+' · qty '+qty(r.qty)+(r.lr?' · LR '+r.lr:''),r.date));
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function showPwReset(uid){
  const u=USERS.get(uid);if(!u)return;
  $('#formHost').innerHTML='<form id="pwf" class="form" data-uid="'+esc(uid)+'" novalidate><h3>Reset password for '+esc(u.user)+'</h3><div class="grid"><div class="f"><label for="rp_pw">New password</label><input id="rp_pw" type="text" autocomplete="off"></div></div><div class="fa"><button class="btn primary" type="submit">Save password</button><button class="btn" type="button" data-act="cancel">Cancel</button><span id="ferr" class="ferr" role="alert"></span></div><p class="muted">Tell the user their new password. They can log in with it straight away.</p></form>';
  $('#rp_pw').focus();
}


/* ---------- PI Generator sync (Supabase, read-only) ---------- */
const PI_URL='https://xsdcvwjithtsvhcntovp.supabase.co';
const PI_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZGN2d2ppdGh0c3ZoY250b3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MTg5MTYsImV4cCI6MjEwMTM5NDkxNn0.2GtTm9QaqMcpIx3Z5BS7VTiCP9MD8TmzuNDs2dGzlZA';
const PI_EVERY=60000, PI_SEEN_KEY='orderdesk:pi:seen', PI_ADV_KEY='orderdesk:pi:advmode';
let piBusy=false;
function piCo(c){c=String(c||'').toLowerCase();if(/cosm/.test(c))return 'scp';if(/dyana|intern|^di$/.test(c))return 'di';return 'si';}
function piSeen(){try{return new Set(JSON.parse(localStorage.getItem(PI_SEEN_KEY)||'[]'));}catch(e){return new Set();}}
function piSave(set){try{localStorage.setItem(PI_SEEN_KEY,JSON.stringify([...set]));}catch(e){}}
const piSlug=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,40);
async function syncPI(manual){
  if(piBusy)return;piBusy=true;
  try{
    const piGet=cols=>fetch(PI_URL+'/rest/v1/pis?select='+cols+'&order=created_at.asc&limit=1000',{headers:{apikey:PI_KEY,Authorization:'Bearer '+PI_KEY}});
    const BASE='id,company,pi_number,buyer_name,buyer_contact,buyer_phone,buyer_email,buyer_gst,buyer_address,pi_date,items';
    let res=await piGet(BASE+',brand_name');
    /* If the PI database has no brand_name column yet, carry on without brands instead of failing the whole sync. */
    if(res.status===400)res=await piGet(BASE);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    const seen=piSeen();let nc=0,np=0,nb=0,na=0,touched=new Set();const adds=[];
    rows.forEach(pi=>{
      const k=piCo(pi.company),name=String(pi.buyer_name||'').trim();
      if(!name)return;
      const stamp={createdBy:'pi',createdByName:'PI Generator',createdAt:String(pi.pi_date||todayStr()).slice(0,10)};
      let cl=[...D[k].clients.values()].find(c=>norm(c.name)===norm(name)||(pi.buyer_gst&&c.gstin&&norm(c.gstin)===norm(pi.buyer_gst)));
      const ckey='c|'+k+'|'+piSlug(name);
      if(!cl&&!seen.has(ckey)){
        cl=Object.assign({id:'pi_c_'+k+'_'+piSlug(name),name:name,brand:String(pi.brand_name||'').trim(),gstin:String(pi.buyer_gst||'').toUpperCase(),contact:pi.buyer_contact||'',phone:pi.buyer_phone||'',email:pi.buyer_email||'',city:'',address:pi.buyer_address||'',notes:'Auto-created from PI '+(pi.pi_number||'')},stamp);
        D[k].clients.set(cl.id,cl);seen.add(ckey);nc++;touched.add(k+'|clients');
      }
      if(!cl)return;
      /* Fill in a missing brand from the PI, but never overwrite a brand someone already typed here. */
      const pb=String(pi.brand_name||'').trim();
      if(pb&&!String(cl.brand||'').trim()){cl.brand=pb;nb++;touched.add(k+'|clients');}
      (Array.isArray(pi.items)?pi.items:[]).forEach((it,ix)=>{
        const pn=String(it.product||'').replace(/\s+/g,' ').trim(),rate=+it.price;
        if(!pn||!(rate>=0))return;
        const pkey='p|'+k+'|'+cl.id+'|'+piSlug(pn);
        let p=[...D[k].products.values()].find(x=>x.clientId===cl.id&&norm(x.name)===norm(pn));
        if(!p&&!seen.has(pkey)){
          p=Object.assign({id:'pi_p_'+k+'_'+piSlug(cl.name)+'_'+piSlug(pn),clientId:cl.id,name:pn,cost:rate,advPct:+it.advancePct||0,terms:30},stamp);
          D[k].products.set(p.id,p);seen.add(pkey);np++;touched.add(k+'|products');
        }
        /* Advance: one entry per PI line, with the PI number in the PO number field, the PI quantity and the PI rate.
           Nothing is marked as received; it shows as pending until the real payment is entered. */
        const pino=String(pi.pi_number||'').trim(),qty=+it.qty;
        if(!ME||!p||!pino||!(qty>0))return;
        const akey='a|'+k+'|'+piSlug(pino)+'|'+ix;
        if(seen.has(akey))return;
        const have=[...D[k].advances.values()].some(a=>norm(a.po)===norm(pino)&&a.productId===p.id)||adds.some(a=>a.k===k&&norm(a.row.po)===norm(pino)&&a.row.productId===p.id);
        if(have){seen.add(akey);return;}
        adds.push({k:k,akey:akey,row:Object.assign({id:'pi_a_'+k+'_'+piSlug(pino)+'_'+ix,date:String(pi.pi_date||todayStr()).slice(0,10),productId:p.id,po:pino,poQty:qty,poRate:rate,received:0,note:'Auto-created from PI '+pino+'. Advance not received yet.'},stamp)});
      });
    });
    if(adds.length){
      /* First time with many PIs waiting: ask once whether to bring the existing ones in. */
      let go=true,mode='';
      try{mode=localStorage.getItem(PI_ADV_KEY)||'';}catch(e){}
      if(!mode&&adds.length>3)go=confirm(adds.length+' PI lines from PI Desk are not in Advance yet.\n\nAdd them now? They are added as pending advance (PO number = PI number, with quantity and rate). Nothing is marked as received.\n\nOK = add them all. Cancel = skip the existing ones and only add new PIs from now on.');
      try{localStorage.setItem(PI_ADV_KEY,go?'all':'new');}catch(e){}
      adds.forEach(a=>{seen.add(a.akey);if(go){D[a.k].advances.set(a.row.id,a.row);na++;touched.add(a.k+'|advances');}});
    }
    touched.forEach(t=>{const a=t.split('|');saveLocal(a[0],a[1]);});
    piSave(seen);
    if(nc||np||nb||na){buildAll();toast('PI sync: '+nc+' new client(s), '+np+' new product(s)'+(nb?', '+nb+' brand(s) filled':'')+(na?', '+na+' advance entr'+(na===1?'y':'ies'):''));}
    else if(manual)toast('PI sync: nothing new ('+rows.length+' PIs checked)');
  }catch(e){if(manual)toast('PI sync failed: '+((e&&e.message)||'network error'));}
  finally{piBusy=false;}
}
initGate();
loadUI();
buildAll();
loadLocal();loadLocalUsers();usersReady=true;gateReady();
buildAll();
syncPI(false);setInterval(()=>syncPI(false),PI_EVERY);
})();
</script>
